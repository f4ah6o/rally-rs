[package]
name = "rally-rs"
version = "2026.5.0"
edition = "2024"
license = "MIT"
description = "Cross-agent messaging for CLI AI agents"
repository = "https://github.com/fujibee/rally-rs"

[[bin]]
name = "ral"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
clap = { version = "4.5.38", features = ["derive", "env"] }
dirs = "6.0.0"
libc = "0.2.172"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
signal-hook = "0.3.18"
tempfile = "3.20.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
